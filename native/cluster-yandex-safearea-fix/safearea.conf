# cluster-yandex-safearea-fix — the instrument-cluster safe area, tuned for
# Yandex Maps. WxH+X+Y, in the 1088x480 cluster map frame waze-on-cluster
# advertises. This one rectangle applies to every CarPlay app, so it is right
# for Yandex Maps and may misplace the guidance banner on others.
#
# Override without editing this file (updates overwrite it) by writing the same
# line to  /var/opt/cluster-yandex-safearea-fix/safearea.local.conf
safe=504x368+433+72
